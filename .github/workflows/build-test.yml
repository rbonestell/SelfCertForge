name: Build & Test

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  # Pin to the exact SDK from global.json so setup-dotnet doesn't pick up
  # a different patch — keeps build behavior identical to the local makefile
  # and the existing Release workflow.
  DOTNET_VERSION: "10.0.402"
  MAUI_WORKLOAD_VERSION: "10.0.402"

jobs:
  build-app:
    name: Build App (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: xcode-27
            workload: maui-maccatalyst
          - os: windows-latest
            workload: maui-windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Install the SDK into a dedicated dir so the cache holds only our SDK +
      # workload, not the runner's preinstalled SDKs. setup-dotnet honors this.
      - name: Set .NET install dir
        shell: bash
        run: echo "DOTNET_INSTALL_DIR=${{ runner.temp }}/dotnet" >> "$GITHUB_ENV"

      # Workloads install into the SDK dir, so caching it skips the workload
      # install on hit. Bumping either version in the key forces a fresh install.
      - name: Cache .NET SDK + MAUI workload
        id: dotnet-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.DOTNET_INSTALL_DIR }}
          key: dotnet-${{ runner.os }}-${{ runner.arch }}-${{ env.DOTNET_VERSION }}-${{ matrix.workload }}-${{ env.MAUI_WORKLOAD_VERSION }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install MAUI workload
        if: steps.dotnet-cache.outputs.cache-hit != 'true'
        run: dotnet workload install ${{ matrix.workload }} --version ${{ env.MAUI_WORKLOAD_VERSION }}

      # Mac Catalyst SDK 27.0 (workload 10.0.402) requires Xcode 27.0. Only the preview xcode-27 runner has it; move back to macos-latest once GA images ship Xcode 27.
      - name: Select Xcode
        if: runner.os == 'macOS'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.0'

      - name: Build (make build)
        # The makefile picks the right TFM based on the runner OS:
        #   macOS   -> net10.0-maccatalyst
        #   Windows -> net10.0-windows10.0.19041.0
        run: make build

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Run tests (make test)
        # Mirrors local dev — the makefile is the single source of truth for
        # which test projects are run. New test projects get added there.
        run: make test
